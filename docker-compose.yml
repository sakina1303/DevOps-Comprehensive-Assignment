services:
  mongo:
    image: mongo:latest
    container_name: mongo
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db

  app:
    build: .
    container_name: app
    restart: unless-stopped
    ports:
      - "80:5000"
    depends_on:
      - mongo
    environment:
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/devops-assignment

volumes:
  mongo-data:
